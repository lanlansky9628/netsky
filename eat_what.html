<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8461f">
<title>今天吃什么？交给命运吧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">

<style>
  /* ============================================================
     今天吃什么 · 随机决策器
     单机个人版：数据全部存在浏览器本地（localStorage），无需联网
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  * { -webkit-tap-highlight-color: transparent; }

  :root {
    --hot: #e8461f;
    --deep: #b8280c;
    --amber: #ffa62b;
    --cream: #fff4e0;
    --ink: #4a1a06;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "Songti SC", "STSong", Georgia, "SimSun", serif;
  }

  /* 横向溢出裁剪：漂浮 emoji 定位到 96% 会略微出界。
     用 clip 而不是 hidden —— hidden 会在 html 上建立滚动容器，
     导致根元素出现无意义的滚动区域（实测 scrollWidth 反而小于视口）。 */
  html { overflow-x: clip; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    /* 暖色调：橙黄 → 红 渐变 */
    background:
      radial-gradient(ellipse 90% 50% at 50% -8%, rgba(255, 214, 130, .85) 0%, rgba(255, 168, 60, 0) 62%),
      radial-gradient(ellipse 80% 45% at 12% 106%, rgba(255, 120, 40, .45) 0%, rgba(0, 0, 0, 0) 68%),
      linear-gradient(168deg, #ffd88a 0%, #ffb44d 26%, #f2732c 58%, #d93a14 84%, #a81f06 100%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-user-select: none;
    user-select: none;
  }

  /* 漂浮的食物 emoji 氛围层 */
  #floaties { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .floaty {
    position: absolute; left: 0; opacity: .16; filter: blur(.4px);
    animation: floatUp linear infinite; will-change: transform;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    12%  { opacity: .18; }
    88%  { opacity: .18; }
    100% { transform: translateY(-112vh) rotate(28deg); opacity: 0; }
  }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: clamp(20px, 5vw, 34px) clamp(14px, 4.5vw, 24px) calc(40px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: clamp(14px, 3.4vw, 20px);
  }

  /* ===================== 标题 ===================== */
  .hero { text-align: center; padding-top: 6px; }
  .hero h1 {
    margin: 0;
    font-size: clamp(23px, 6.8vw, 34px);
    font-weight: 800; letter-spacing: 2px;
    color: #fff8ec;
    text-shadow: 0 3px 0 rgba(150, 40, 10, .35), 0 8px 22px rgba(120, 30, 0, .45);
  }
  .hero h1 .qw { color: #fff; }
  .hero p {
    margin: 10px 0 0;
    font-size: clamp(12px, 3.4vw, 14px); letter-spacing: 3px;
    color: rgba(255, 248, 236, .78);
    text-shadow: 0 1px 6px rgba(120, 30, 0, .4);
  }

  /* ===================== 卡片 ===================== */
  .card {
    background: linear-gradient(170deg, rgba(255, 252, 245, .97) 0%, rgba(255, 244, 224, .95) 100%);
    border-radius: var(--radius);
    padding: clamp(14px, 4vw, 20px);
    box-shadow: 0 14px 34px rgba(120, 30, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .9);
    border: 1px solid rgba(255, 255, 255, .7);
  }
  .card-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; letter-spacing: 1px;
    color: var(--deep); margin-bottom: 11px;
  }
  .card-title .badge {
    font-size: 11.5px; font-weight: 500;
    color: rgba(120, 40, 10, .55);
    background: rgba(255, 168, 60, .18);
    border-radius: 999px; padding: 2px 9px;
  }
  .spacer { margin-left: auto; }

  /* ===================== 添加 ===================== */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 16px;   /* ≥16px 防 iOS 聚焦缩放 */
    color: var(--ink); background: #fff;
    border: 2px solid rgba(255, 168, 60, .5);
    border-radius: 13px; padding: 12px 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .add-row input::placeholder { color: rgba(120, 40, 10, .35); }
  .add-row input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255, 168, 60, .22); }
  .btn {
    font-family: inherit; font-weight: 700;
    border: 0; cursor: pointer; touch-action: manipulation;
    border-radius: 13px;
    transition: transform .14s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn-add {
    flex: 0 0 auto; font-size: 15px; letter-spacing: 1px; color: #fff;
    padding: 12px 20px;
    background: linear-gradient(160deg, #ffa62b, #f2701c 60%, #dc4a0f);
    box-shadow: 0 6px 16px rgba(200, 70, 10, .38), inset 0 1px 0 rgba(255, 255, 255, .45);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .chip {
    font-family: inherit; font-size: 12.5px; color: var(--deep);
    background: rgba(255, 168, 60, .16);
    border: 1px dashed rgba(216, 80, 20, .45);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
    transition: background .18s, transform .14s;
  }
  .chip:active { transform: scale(.95); }
  .chip:hover { background: rgba(255, 168, 60, .32); }

  /* ===================== 食物列表 ===================== */
  .food-list {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 12px;
    max-height: 240px; overflow-y: auto; padding: 2px;
  }
  .food-item {
    display: inline-flex; align-items: center; gap: 7px;
    background: linear-gradient(160deg, #fff8ec, #ffe9c9);
    border: 1.5px solid rgba(240, 150, 60, .55);
    border-radius: 999px; padding: 7px 9px 7px 14px;
    font-size: 14px; font-weight: 600; color: #8a3208;
    box-shadow: 0 3px 9px rgba(190, 90, 20, .16);
    animation: popIn .26s cubic-bezier(.2, 1.5, .4, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.75); }
    to   { opacity: 1; transform: scale(1); }
  }
  .food-item .del {
    width: 20px; height: 20px; flex: 0 0 auto;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: rgba(216, 80, 20, .14); color: #b8280c;
    font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
    transition: background .18s, transform .14s;
  }
  .food-item .del:active { transform: scale(.88); }
  .food-item .del:hover { background: rgba(216, 80, 20, .3); }

  .empty-tip {
    margin-top: 12px; font-size: 13px; letter-spacing: .5px;
    color: rgba(120, 40, 10, .45); text-align: center;
    padding: 14px 8px;
    border: 1.5px dashed rgba(200, 120, 40, .35); border-radius: 13px;
  }

  /* ===================== 抽奖区 ===================== */
  .slot-card {
    text-align: center;
    background: linear-gradient(170deg, #3a1405 0%, #571e07 55%, #2c0e03 100%);
    border: 1px solid rgba(255, 190, 90, .35);
    box-shadow: 0 16px 40px rgba(80, 20, 0, .45), inset 0 1px 0 rgba(255, 210, 140, .25);
  }
  .display {
    position: relative; border-radius: 14px;
    padding: clamp(16px, 4.5vw, 22px) 14px;
    background:
      repeating-linear-gradient(0deg, rgba(255, 200, 110, .05) 0 2px, rgba(0, 0, 0, 0) 2px 4px),
      linear-gradient(180deg, #1d0a02, #2e1206);
    border: 1px solid rgba(255, 190, 90, .28);
    overflow: hidden;
  }
  .display-label {
    font-size: 11px; letter-spacing: 4px;
    color: rgba(255, 200, 130, .55); margin-bottom: 8px;
  }
  #slotName {
    display: block; min-height: 1.35em;
    font-size: clamp(26px, 9vw, 44px); font-weight: 800; letter-spacing: 2px;
    font-family: var(--serif);
    color: #ffd88a;
    text-shadow: 0 0 18px rgba(255, 170, 50, .75), 0 2px 3px rgba(0, 0, 0, .6);
    word-break: break-word; line-height: 1.35;
  }
  #slotName.rolling { color: #fff0cf; text-shadow: 0 0 22px rgba(255, 200, 90, .95); }
  #slotName.win {
    color: #fff6dd;
    text-shadow: 0 0 28px rgba(255, 200, 90, 1), 0 0 60px rgba(255, 130, 30, .8);
    animation: winPop .55s cubic-bezier(.2, 1.7, .4, 1);
  }
  @keyframes winPop {
    0%   { transform: scale(.7); }
    60%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .display-hint {
    margin-top: 10px; font-size: 12px; letter-spacing: 1px;
    color: rgba(255, 200, 130, .5); min-height: 1.4em;
  }

  .btn-spin {
    width: 100%; margin-top: 16px;
    font-size: clamp(17px, 5vw, 21px);
    letter-spacing: 5px; text-indent: 5px;
    color: #7a2a06;
    padding: clamp(15px, 4.2vw, 19px) 20px;
    border-radius: 999px;
    background: linear-gradient(160deg, #fff2cf 0%, #ffc253 40%, #ff9a1f 100%);
    box-shadow: 0 10px 26px rgba(255, 140, 20, .45), inset 0 2px 0 rgba(255, 255, 255, .8);
    animation: spinPulse 2.4s ease-in-out infinite;
  }
  @keyframes spinPulse {
    0%, 100% { box-shadow: 0 10px 26px rgba(255,140,20,.45), inset 0 2px 0 rgba(255,255,255,.8), 0 0 0 0 rgba(255, 220, 140, .7); }
    60%      { box-shadow: 0 10px 26px rgba(255,140,20,.45), inset 0 2px 0 rgba(255,255,255,.8), 0 0 0 17px rgba(255, 220, 140, 0); }
  }
  .btn-spin:disabled { opacity: .6; animation: none; cursor: default; }

  .btn-again {
    margin-top: 11px; font-size: 14px; letter-spacing: 2px;
    color: #ffe6b0; background: rgba(255, 200, 110, .14);
    border: 1px solid rgba(255, 190, 90, .45);
    padding: 11px 22px; border-radius: 999px; display: none;
  }
  .btn-again.show { display: inline-block; animation: popIn .3s ease; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 15px; padding-top: 14px;
    border-top: 1px dashed rgba(255, 190, 90, .28);
  }
  .switch-label { text-align: left; }
  .switch-label strong { display: block; font-size: 13.5px; color: #ffdda0; letter-spacing: 1px; font-weight: 600; }
  .switch-label span { font-size: 11.5px; color: rgba(255, 200, 130, .5); }
  .switch { position: relative; flex: 0 0 auto; width: 52px; height: 30px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 190, 90, .35);
    transition: background .25s;
  }
  .switch .knob {
    position: absolute; top: 4px; left: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #ffe6b0; box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    transition: transform .25s cubic-bezier(.4, 1.4, .5, 1);
  }
  .switch input:checked ~ .track { background: linear-gradient(120deg, #ffb03a, #ff7a1f); }
  .switch input:checked ~ .knob { transform: translateX(22px); background: #fff; }

  /* ===================== 历史记录 ===================== */
  .history { display: flex; flex-direction: column; gap: 7px; }
  .hist-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 168, 60, .12);
    border: 1px solid rgba(240, 150, 60, .28);
    border-radius: 11px; padding: 9px 12px; font-size: 13.5px;
    animation: popIn .25s ease;
  }
  .hist-item .idx {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(150deg, #ffa62b, #e8461f);
  }
  .hist-item .name { flex: 1; font-weight: 600; color: #8a3208; }
  .hist-item .time { font-size: 11px; color: rgba(120, 40, 10, .45); }
  .hist-empty { font-size: 13px; color: rgba(120, 40, 10, .42); text-align: center; padding: 8px; }

  .btn-clear {
    font-size: 11.5px; color: rgba(120, 40, 10, .55);
    background: transparent; border: 1px dashed rgba(200, 120, 40, .4);
    border-radius: 999px; padding: 3px 11px; cursor: pointer;
    font-family: inherit;
  }

  /* ===================== 结果弹层 ===================== */
  .verdict {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: 22px;
    background: radial-gradient(ellipse at center, rgba(60, 12, 0, .78) 0%, rgba(30, 5, 0, .88) 100%);
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }
  .verdict.show { opacity: 1; visibility: visible; }
  .verdict-box {
    width: 100%; max-width: 380px; text-align: center;
    padding: clamp(24px, 7vw, 34px) clamp(18px, 5vw, 28px) clamp(20px, 5.5vw, 26px);
    border-radius: 26px;
    background: linear-gradient(168deg, #fffaf0 0%, #ffeccd 60%, #ffdca8 100%);
    box-shadow: 0 26px 60px rgba(60, 10, 0, .55), inset 0 2px 0 #fff;
    transform: scale(.86) translateY(14px);
    transition: transform .42s cubic-bezier(.2, 1.5, .4, 1);
  }
  .verdict.show .verdict-box { transform: scale(1) translateY(0); }
  .verdict-emoji { font-size: 40px; line-height: 1; }
  .verdict-kicker {
    margin-top: 12px; font-size: 14px; letter-spacing: 5px; text-indent: 5px;
    color: rgba(160, 60, 10, .7);
  }
  .verdict-name {
    margin-top: 8px;
    font-size: clamp(32px, 11vw, 52px); font-weight: 800;
    font-family: var(--serif); letter-spacing: 2px; color: #c2290a;
    text-shadow: 0 2px 0 rgba(255, 255, 255, .8), 0 8px 22px rgba(200, 60, 0, .3);
    line-height: 1.25; word-break: break-word;
  }
  .verdict-sub { margin-top: 14px; font-size: 13px; letter-spacing: 1px; color: rgba(150, 70, 20, .65); }
  .verdict-actions { display: flex; gap: 10px; margin-top: 20px; }
  .verdict-actions .btn { flex: 1; font-size: 15px; letter-spacing: 2px; padding: 13px 12px; border-radius: 999px; }
  .btn-ok {
    color: #fff; background: linear-gradient(160deg, #ff9a1f, #e8461f);
    box-shadow: 0 8px 20px rgba(200, 60, 10, .4);
  }
  .btn-retry {
    color: #8a3208; background: rgba(255, 168, 60, .22);
    border: 1.5px solid rgba(240, 150, 60, .55);
  }

  .confetti {
    position: fixed; top: -10vh; z-index: 21; font-size: 20px;
    pointer-events: none; animation: confFall linear forwards;
  }
  @keyframes confFall { to { transform: translateY(118vh) rotate(520deg); opacity: 0; } }

  .foot {
    text-align: center; font-size: 11.5px; letter-spacing: 2px;
    color: rgba(255, 248, 236, .55);
    text-shadow: 0 1px 4px rgba(120, 30, 0, .4);
  }

  @media (prefers-reduced-motion: reduce) {
    .floaty, .btn-spin, .confetti, #slotName.win { animation: none !important; }
  }
</style>
</head>
<body>

  <div id="floaties" aria-hidden="true"></div>

  <div class="wrap">

    <header class="hero">
      <h1>今天吃什么？<span class="qw">交给命运吧</span></h1>
      <p>选择困难症的终极解药</p>
    </header>

    <!-- ===== 抽奖区（最醒目，放前面） ===== -->
    <section class="card slot-card">
      <div class="display">
        <div class="display-label">今 日 之 选</div>
        <strong id="slotName">— — —</strong>
        <div class="display-hint" id="slotHint">点下面的按钮，让命运决定</div>
      </div>

      <button class="btn btn-spin" id="spinBtn">抽 奖</button>
      <button class="btn btn-again" id="againBtn">换 一 个</button>

      <div class="switch-row">
        <div class="switch-label">
          <strong>排除刚吃过的</strong>
          <span id="excludeInfo">开启后会避开上次的结果</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="excludeToggle">
          <span class="track"></span>
          <span class="knob"></span>
        </label>
      </div>
    </section>

    <!-- ===== 食物管理 ===== -->
    <section class="card">
      <div class="card-title">
        <span>🍜 我的菜单</span>
        <span class="badge" id="foodCount">0 项</span>
      </div>

      <div class="add-row">
        <input id="foodInput" type="text" maxlength="12" autocomplete="off"
               placeholder="输入食物名，比如：酸菜鱼" aria-label="输入食物名">
        <button class="btn btn-add" id="addBtn">添加</button>
      </div>

      <div class="chips" id="chips"></div>
      <div id="listBox"></div>
    </section>

    <!-- ===== 历史记录 ===== -->
    <section class="card">
      <div class="card-title">
        <span>🕒 历史记录</span>
        <button class="btn-clear" id="clearHistBtn" style="margin-left:auto">清空</button>
      </div>
      <div class="history" id="historyBox"></div>
    </section>

    <p class="foot">数据保存在你自己的浏览器里 · 换设备不同步</p>
  </div>

  <!-- ===== 结果弹层 ===== -->
  <div class="verdict" id="verdict" role="dialog" aria-modal="true" aria-label="抽奖结果">
    <div class="verdict-box">
      <div class="verdict-emoji" id="verdictEmoji">🍽️</div>
      <div class="verdict-kicker">今 天 就 吃</div>
      <div class="verdict-name" id="verdictName"></div>
      <div class="verdict-sub" id="verdictSub"></div>
      <div class="verdict-actions">
        <button class="btn btn-retry" id="retryBtn">换一个</button>
        <button class="btn btn-ok" id="okBtn">就它了！</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     存储层：localStorage（单机版，无后端、无网络请求）
     ============================================================ */
  var KEY_FOODS = 'eatwhat.foods';
  var KEY_HIST = 'eatwhat.history';
  var KEY_EXCLUDE = 'eatwhat.exclude';
  var KEY_LAST = 'eatwhat.last';

  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      var v = JSON.parse(raw);
      return v === null || v === undefined ? fallback : v;
    } catch (e) { return fallback; }
  }
  function write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var DEFAULT_FOODS = ['酸菜鱼', '麻辣烫', '牛肉面', '黄焖鸡', '寿司', '烤肉', '汉堡', '饺子'];

  var foods = read(KEY_FOODS, null);
  if (!Array.isArray(foods)) {
    foods = DEFAULT_FOODS.slice();     // 第一次打开给点灵感
    write(KEY_FOODS, foods);
  }
  var history = read(KEY_HIST, []);
  if (!Array.isArray(history)) history = [];
  var excludeOn = read(KEY_EXCLUDE, false) === true;
  var lastPick = read(KEY_LAST, null);
  if (typeof lastPick === 'string') {
    // 兼容早期版本可能写入的二次编码值（例如 "\"烤肉\""）
    try {
      var once = JSON.parse(lastPick);
      if (typeof once === 'string') lastPick = once;
    } catch (e) {}
  }

  function $(id) { return document.getElementById(id); }

  /* ============================================================
     漂浮食物氛围
     ============================================================ */
  (function buildFloaties() {
    var layer = $('floaties');
    var EMOJI = ['🍜', '🍕', '🍣', '🍔', '🥟', '🍢', '🍚', '🌮', '🍤', '🥘', '🍰', '🍩'];
    var n = window.innerWidth < 480 ? 12 : 18;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'floaty';
      s.textContent = EMOJI[i % EMOJI.length];
      s.style.left = (Math.random() * 96) + '%';
      s.style.fontSize = (16 + Math.random() * 26).toFixed(0) + 'px';
      s.style.animationDuration = (16 + Math.random() * 18).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * 30).toFixed(1) + 's';
      frag.appendChild(s);
    }
    layer.appendChild(frag);
  })();

  /* ============================================================
     渲染：食物列表 / 历史
     ============================================================ */
  var listBox = $('listBox');
  var foodCount = $('foodCount');

  function renderFoods() {
    foodCount.textContent = foods.length + ' 项';
    listBox.textContent = '';

    if (!foods.length) {
      var tip = document.createElement('div');
      tip.className = 'empty-tip';
      tip.textContent = '还没有食物，先加几个吧 ✍️';
      listBox.appendChild(tip);
      return;
    }

    var wrap = document.createElement('div');
    wrap.className = 'food-list';
    foods.forEach(function (name, i) {
      var item = document.createElement('span');
      item.className = 'food-item';

      var label = document.createElement('span');
      label.textContent = name;                 // textContent：天然防 XSS

      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '✕';
      del.setAttribute('aria-label', '删除 ' + name);
      del.addEventListener('click', function () {
        foods.splice(i, 1);
        write(KEY_FOODS, foods);
        renderFoods();
        updateExcludeInfo();
      });

      item.appendChild(label);
      item.appendChild(del);
      wrap.appendChild(item);
    });
    listBox.appendChild(wrap);
  }

  function renderHistory() {
    var box = $('historyBox');
    box.textContent = '';
    if (!history.length) {
      var e = document.createElement('div');
      e.className = 'hist-empty';
      e.textContent = '还没有抽过，快去试试手气 🎲';
      box.appendChild(e);
      return;
    }
    history.forEach(function (h, i) {
      var row = document.createElement('div');
      row.className = 'hist-item';

      var idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = String(i + 1);

      var nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = h.name;

      var tm = document.createElement('span');
      tm.className = 'time';
      tm.textContent = h.time || '';

      row.appendChild(idx);
      row.appendChild(nm);
      row.appendChild(tm);
      box.appendChild(row);
    });
  }

  function pushHistory(name) {
    var d = new Date();
    var hh = ('0' + d.getHours()).slice(-2);
    var mm = ('0' + d.getMinutes()).slice(-2);
    history.unshift({ name: name, time: hh + ':' + mm });
    if (history.length > 5) history = history.slice(0, 5);   // 只留最近 5 次
    write(KEY_HIST, history);
    renderHistory();
  }

  function updateExcludeInfo() {
    var info = $('excludeInfo');
    if (!excludeOn) {
      info.textContent = '开启后会避开上次的结果';
      return;
    }
    if (foods.length <= 1) {
      info.textContent = '菜单只有一个，无法避开';
    } else if (lastPick) {
      info.textContent = '已避开：' + lastPick;
    } else {
      info.textContent = '已开启，下次抽奖生效';
    }
  }

  /* ============================================================
     添加 / 删除食物
     ============================================================ */
  var foodInput = $('foodInput');

  function addFood(name) {
    name = (name || '').trim().replace(/\s+/g, ' ').slice(0, 12);
    if (!name) { foodInput.focus(); return; }
    if (foods.indexOf(name) !== -1) {
      flashHint('「' + name + '」已经在菜单里了');
      return;
    }
    foods.push(name);
    write(KEY_FOODS, foods);
    renderFoods();
    updateExcludeInfo();
    foodInput.value = '';
    foodInput.focus();
  }

  $('addBtn').addEventListener('click', function () { addFood(foodInput.value); });
  foodInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addFood(foodInput.value); }
  });

  // 快捷标签
  (function buildChips() {
    var box = $('chips');
    ['火锅', '烧烤', '螺蛳粉', '盖浇饭', '沙拉', '小笼包', '炸鸡', '咖喱饭'].forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = '+ ' + s;
      b.addEventListener('click', function () { addFood(s); });
      box.appendChild(b);
    });
  })();

  /* ============================================================
     抽奖：老虎机式减速滚动
     ============================================================ */
  var slotName = $('slotName');
  var slotHint = $('slotHint');
  var spinBtn = $('spinBtn');
  var againBtn = $('againBtn');
  var verdict = $('verdict');
  var excludeToggle = $('excludeToggle');

  var spinning = false;
  var lastPickBefore = null;

  function flashHint(text) {
    slotHint.textContent = text;
    clearTimeout(flashHint._t);
    flashHint._t = setTimeout(function () {
      slotHint.textContent = '点下面的按钮，让命运决定';
    }, 2600);
  }

  // 候选池：开启排除时过滤掉上次的结果
  function candidates() {
    if (!excludeOn || !lastPick || foods.length <= 1) return foods.slice();
    var pool = foods.filter(function (f) { return f !== lastPick; });
    // 极端情况：过滤后为空（理论上不会发生，因为 length>1 时才过滤）
    return pool.length ? pool : foods.slice();
  }

  function spin() {
    if (spinning) return;

    if (foods.length === 0) {
      flashHint('菜单是空的，先添加几个食物吧');
      foodInput.focus();
      return;
    }

    // 记下"抽之前"的那一次结果，用于结果里显示"已避开 XX"
    lastPickBefore = (excludeOn && lastPick) ? lastPick : null;

    spinning = true;
    spinBtn.disabled = true;
    againBtn.classList.remove('show');
    slotName.classList.remove('win');
    slotName.classList.add('rolling');

    var pool = candidates();
    var finalName = pool[Math.floor(Math.random() * pool.length)];

    // 滚动序列：先快后慢（老虎机手感），总时长约 1 秒
    var seq = [];
    var steps = 14;
    for (var i = 0; i < steps; i++) seq.push(pool[Math.floor(Math.random() * pool.length)]);
    seq.push(finalName);

    var totalMs = 1000;
    var weights = [], sumW = 0;
    for (var j = 0; j < seq.length; j++) { var w = 0.5 + j * 0.16; weights.push(w); sumW += w; }

    var idx = 0;
    (function next() {
      if (idx >= seq.length) return finish(finalName);
      slotName.textContent = seq[idx];
      var delay = (weights[idx] / sumW) * totalMs;
      idx++;
      setTimeout(next, delay);
    })();
  }

  function finish(name) {
    slotName.textContent = name;
    slotName.classList.remove('rolling');
    slotName.classList.add('win');

    lastPick = name;
    write(KEY_LAST, lastPick);
    pushHistory(name);
    updateExcludeInfo();

    spinning = false;
    spinBtn.disabled = false;
    againBtn.classList.add('show');

    showVerdict(name);
  }

  function showVerdict(name) {
    $('verdictName').textContent = name;
    $('verdictEmoji').textContent = EMOJI_FOR[name] || '🍽️';
    var subs = [
      '别犹豫了，就它吧！',
      '命运的旨意，无法违抗 ✨',
      '这顿饭，交给月亮决定 🌙',
      '吃完再想下一顿也不迟 😋',
      '相信直觉，就是它了'
    ];
    var extra = '';
    if (excludeOn && lastPickBefore) extra = '（已避开「' + lastPickBefore + '」）';
    $('verdictSub').textContent = subs[Math.floor(Math.random() * subs.length)] + extra;

    verdict.classList.add('show');
    burstConfetti();
  }

  var EMOJI_FOR = {
    '酸菜鱼': '🐟', '麻辣烫': '🍲', '牛肉面': '🍜', '黄焖鸡': '🍗',
    '寿司': '🍣', '烤肉': '🍖', '汉堡': '🍔', '饺子': '🥟',
    '火锅': '🍲', '烧烤': '🍢', '螺蛳粉': '🍜', '盖浇饭': '🍚',
    '沙拉': '🥗', '小笼包': '🥟', '炸鸡': '🍗', '咖喱饭': '🍛'
  };

  function burstConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var EMOJI = ['🎉', '✨', '🍜', '🍕', '🍣', '🥳', '⭐', '🍰'];
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = EMOJI[Math.floor(Math.random() * EMOJI.length)];
      s.style.left = (Math.random() * 96) + '%';
      s.style.fontSize = (16 + Math.random() * 16).toFixed(0) + 'px';
      s.style.animationDuration = (1.6 + Math.random() * 1.4).toFixed(2) + 's';
      document.body.appendChild(s);
      (function (node) {
        setTimeout(function () { node.remove(); }, 3200);
      })(s);
    }
  }

  function closeVerdict() { verdict.classList.remove('show'); }

  spinBtn.addEventListener('click', function () { spin(); });
  againBtn.addEventListener('click', function () { closeVerdict(); spin(); });
  $('okBtn').addEventListener('click', closeVerdict);
  $('retryBtn').addEventListener('click', function () { closeVerdict(); spin(); });
  verdict.addEventListener('click', function (e) { if (e.target === verdict) closeVerdict(); });

  excludeToggle.checked = excludeOn;
  excludeToggle.addEventListener('change', function () {
    excludeOn = excludeToggle.checked;
    write(KEY_EXCLUDE, excludeOn);
    updateExcludeInfo();
    flashHint(excludeOn ? '已开启：会避开上次吃过的' : '已关闭：完全随机');
  });

  $('clearHistBtn').addEventListener('click', function () {
    history = [];
    write(KEY_HIST, history);
    renderHistory();
    flashHint('历史记录已清空');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeVerdict();
    // 空格键快捷抽奖（输入框里不触发）
    if (e.code === 'Space' && document.activeElement !== foodInput) {
      e.preventDefault();
      spin();
    }
  });

  /* ============================================================
     启动
     ============================================================ */
  renderFoods();
  renderHistory();
  updateExcludeInfo();
  if (lastPick) slotName.textContent = lastPick;
})();
</script>
</body>
</html>
