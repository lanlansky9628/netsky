<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e8461f">
<title>今天吃什么？交给命运吧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">

<style>
  /* ============================================================
     今天吃什么 · 宿舍共享版（Supabase 云端菜单 + 云端历史）
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  * { -webkit-tap-highlight-color: transparent; }

  :root {
    --hot: #e8461f;
    --deep: #b8280c;
    --amber: #ffa62b;
    --cream: #fff4e0;
    --ink: #4a1a06;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "Songti SC", "STSong", Georgia, "SimSun", serif;
  }

  /* 横向溢出裁剪：漂浮 emoji 定位到 96% 会略微出界。
     用 clip 而不是 hidden —— hidden 会在 html 上建立滚动容器，
     导致根元素出现无意义的滚动区域（实测 scrollWidth 反而小于视口）。 */
  html { overflow-x: clip; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(ellipse 90% 50% at 50% -8%, rgba(255, 214, 130, .85) 0%, rgba(255, 168, 60, 0) 62%),
      radial-gradient(ellipse 80% 45% at 12% 106%, rgba(255, 120, 40, .45) 0%, rgba(0, 0, 0, 0) 68%),
      linear-gradient(168deg, #ffd88a 0%, #ffb44d 26%, #f2732c 58%, #d93a14 84%, #a81f06 100%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-user-select: none;
    user-select: none;
  }

  #floaties { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .floaty {
    position: absolute; left: 0; opacity: .16; filter: blur(.4px);
    animation: floatUp linear infinite; will-change: transform;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    12%  { opacity: .18; }
    88%  { opacity: .18; }
    100% { transform: translateY(-112vh) rotate(28deg); opacity: 0; }
  }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: clamp(20px, 5vw, 34px) clamp(14px, 4.5vw, 24px) calc(40px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: clamp(14px, 3.4vw, 20px);
  }

  /* ===================== 标题 ===================== */
  .hero { text-align: center; padding-top: 6px; }
  .hero h1 {
    margin: 0;
    font-size: clamp(22px, 6.4vw, 32px);
    font-weight: 800; letter-spacing: 2px;
    color: #fff8ec;
    text-shadow: 0 3px 0 rgba(150, 40, 10, .35), 0 8px 22px rgba(120, 30, 0, .45);
  }
  .hero h1 .qw { color: #fff; }
  .hero p {
    margin: 10px 0 0;
    font-size: clamp(12px, 3.4vw, 14px); letter-spacing: 3px;
    color: rgba(255, 248, 236, .78);
    text-shadow: 0 1px 6px rgba(120, 30, 0, .4);
  }

  /* 同步状态条 */
  .syncbar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px;
    font-size: 11.5px; letter-spacing: 1px;
    color: rgba(255, 248, 236, .82);
    text-shadow: 0 1px 4px rgba(120, 30, 0, .5);
  }
  .syncbar .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #8ef0a0; box-shadow: 0 0 9px rgba(140, 240, 160, .9);
    flex: 0 0 auto;
    transition: background .3s, box-shadow .3s;
  }
  .syncbar.local .dot { background: #ffd166; box-shadow: 0 0 9px rgba(255, 209, 102, .9); }
  .syncbar.err .dot { background: #ff8a7a; box-shadow: 0 0 9px rgba(255, 138, 122, .9); }
  .syncbar button {
    font-family: inherit; font-size: 11px; letter-spacing: 1px;
    color: #fff6e6;
    background: rgba(255, 255, 255, .18);
    border: 1px solid rgba(255, 255, 255, .38);
    border-radius: 999px; padding: 3px 10px; cursor: pointer;
  }
  .syncbar button:active { transform: scale(.94); }

  /* ===================== 卡片 ===================== */
  .card {
    background: linear-gradient(170deg, rgba(255, 252, 245, .97) 0%, rgba(255, 244, 224, .95) 100%);
    border-radius: var(--radius);
    padding: clamp(14px, 4vw, 20px);
    box-shadow: 0 14px 34px rgba(120, 30, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .9);
    border: 1px solid rgba(255, 255, 255, .7);
  }
  .card-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; font-weight: 700; letter-spacing: 1px;
    color: var(--deep); margin-bottom: 11px;
  }
  .card-title .badge {
    font-size: 11.5px; font-weight: 500;
    color: rgba(120, 40, 10, .55);
    background: rgba(255, 168, 60, .18);
    border-radius: 999px; padding: 2px 9px;
  }
  .spacer { margin-left: auto; }

  /* ===================== 输入 ===================== */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 16px;
    color: var(--ink); background: #fff;
    border: 2px solid rgba(255, 168, 60, .5);
    border-radius: 13px; padding: 12px 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .add-row input::placeholder { color: rgba(120, 40, 10, .35); }
  .add-row input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255, 168, 60, .22); }
  .btn {
    font-family: inherit; font-weight: 700;
    border: 0; cursor: pointer; touch-action: manipulation;
    border-radius: 13px;
    transition: transform .14s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn-add {
    flex: 0 0 auto; font-size: 15px; letter-spacing: 1px; color: #fff;
    padding: 12px 20px;
    background: linear-gradient(160deg, #ffa62b, #f2701c 60%, #dc4a0f);
    box-shadow: 0 6px 16px rgba(200, 70, 10, .38), inset 0 1px 0 rgba(255, 255, 255, .45);
  }
  .btn-add:disabled { opacity: .55; }

  /* 昵称行 */
  .nick-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 11px;
    font-size: 12.5px; color: rgba(120, 40, 10, .62);
  }
  .nick-row input {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 13.5px;
    color: var(--ink); background: rgba(255, 168, 60, .10);
    border: 1.5px dashed rgba(216, 80, 20, .38);
    border-radius: 10px; padding: 7px 11px; outline: none;
  }
  .nick-row input:focus { border-style: solid; border-color: var(--amber); background: #fff; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .chip {
    font-family: inherit; font-size: 12.5px; color: var(--deep);
    background: rgba(255, 168, 60, .16);
    border: 1px dashed rgba(216, 80, 20, .45);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
    transition: background .18s, transform .14s;
  }
  .chip:active { transform: scale(.95); }
  .chip:hover { background: rgba(255, 168, 60, .32); }

  /* ===================== 食物列表 ===================== */
  .food-list {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 12px;
    max-height: 240px; overflow-y: auto; padding: 2px;
  }
  .food-item {
    display: inline-flex; align-items: center; gap: 7px;
    background: linear-gradient(160deg, #fff8ec, #ffe9c9);
    border: 1.5px solid rgba(240, 150, 60, .55);
    border-radius: 999px; padding: 7px 9px 7px 14px;
    font-size: 14px; font-weight: 600; color: #8a3208;
    box-shadow: 0 3px 9px rgba(190, 90, 20, .16);
    animation: popIn .26s cubic-bezier(.2, 1.5, .4, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.75); }
    to   { opacity: 1; transform: scale(1); }
  }
  .food-item .who {
    font-size: 10.5px; font-weight: 500;
    color: rgba(138, 50, 8, .45);
    padding-left: 6px;
    border-left: 1px solid rgba(216, 80, 20, .28);   /* 与菜名分隔，不然会连成"火锅宿舍" */
  }
  .food-item .del {
    width: 20px; height: 20px; flex: 0 0 auto;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: rgba(216, 80, 20, .14); color: #b8280c;
    font-size: 13px; line-height: 1; cursor: pointer; padding: 0;
    transition: background .18s, transform .14s;
  }
  .food-item .del:active { transform: scale(.88); }
  .food-item .del:hover { background: rgba(216, 80, 20, .3); }
  .food-item.pending { opacity: .55; }

  .empty-tip {
    margin-top: 12px; font-size: 13px; letter-spacing: .5px;
    color: rgba(120, 40, 10, .45); text-align: center;
    padding: 14px 8px;
    border: 1.5px dashed rgba(200, 120, 40, .35); border-radius: 13px;
  }
  .skeleton-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .sk {
    height: 34px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,168,60,.14) 25%, rgba(255,168,60,.3) 50%, rgba(255,168,60,.14) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ===================== 抽奖区 ===================== */
  .slot-card {
    text-align: center;
    background: linear-gradient(170deg, #3a1405 0%, #571e07 55%, #2c0e03 100%);
    border: 1px solid rgba(255, 190, 90, .35);
    box-shadow: 0 16px 40px rgba(80, 20, 0, .45), inset 0 1px 0 rgba(255, 210, 140, .25);
  }
  .display {
    position: relative; border-radius: 14px;
    padding: clamp(16px, 4.5vw, 22px) 14px;
    background:
      repeating-linear-gradient(0deg, rgba(255, 200, 110, .05) 0 2px, rgba(0, 0, 0, 0) 2px 4px),
      linear-gradient(180deg, #1d0a02, #2e1206);
    border: 1px solid rgba(255, 190, 90, .28);
    overflow: hidden;
  }
  .display-label {
    font-size: 11px; letter-spacing: 4px;
    color: rgba(255, 200, 130, .55); margin-bottom: 8px;
  }
  #slotName {
    display: block; min-height: 1.35em;
    font-size: clamp(26px, 9vw, 44px); font-weight: 800; letter-spacing: 2px;
    font-family: var(--serif);
    color: #ffd88a;
    text-shadow: 0 0 18px rgba(255, 170, 50, .75), 0 2px 3px rgba(0, 0, 0, .6);
    word-break: break-word; line-height: 1.35;
  }
  #slotName.rolling { color: #fff0cf; text-shadow: 0 0 22px rgba(255, 200, 90, .95); }
  #slotName.win {
    color: #fff6dd;
    text-shadow: 0 0 28px rgba(255, 200, 90, 1), 0 0 60px rgba(255, 130, 30, .8);
    animation: winPop .55s cubic-bezier(.2, 1.7, .4, 1);
  }
  @keyframes winPop {
    0%   { transform: scale(.7); }
    60%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .display-hint {
    margin-top: 10px; font-size: 12px; letter-spacing: 1px;
    color: rgba(255, 200, 130, .5); min-height: 1.4em;
  }

  .btn-spin {
    width: 100%; margin-top: 16px;
    font-size: clamp(17px, 5vw, 21px);
    letter-spacing: 5px; text-indent: 5px;
    color: #7a2a06;
    padding: clamp(15px, 4.2vw, 19px) 20px;
    border-radius: 999px;
    background: linear-gradient(160deg, #fff2cf 0%, #ffc253 40%, #ff9a1f 100%);
    box-shadow: 0 10px 26px rgba(255, 140, 20, .45), inset 0 2px 0 rgba(255, 255, 255, .8);
    animation: spinPulse 2.4s ease-in-out infinite;
  }
  @keyframes spinPulse {
    0%, 100% { box-shadow: 0 10px 26px rgba(255,140,20,.45), inset 0 2px 0 rgba(255,255,255,.8), 0 0 0 0 rgba(255, 220, 140, .7); }
    60%      { box-shadow: 0 10px 26px rgba(255,140,20,.45), inset 0 2px 0 rgba(255,255,255,.8), 0 0 0 17px rgba(255, 220, 140, 0); }
  }
  .btn-spin:disabled { opacity: .6; animation: none; cursor: default; }

  .btn-again {
    margin-top: 11px; font-size: 14px; letter-spacing: 2px;
    color: #ffe6b0; background: rgba(255, 200, 110, .14);
    border: 1px solid rgba(255, 190, 90, .45);
    padding: 11px 22px; border-radius: 999px; display: none;
  }
  .btn-again.show { display: inline-block; animation: popIn .3s ease; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 15px; padding-top: 14px;
    border-top: 1px dashed rgba(255, 190, 90, .28);
  }
  .switch-label { text-align: left; }
  .switch-label strong { display: block; font-size: 13.5px; color: #ffdda0; letter-spacing: 1px; font-weight: 600; }
  .switch-label span { font-size: 11.5px; color: rgba(255, 200, 130, .5); }
  .switch { position: relative; flex: 0 0 auto; width: 52px; height: 30px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 190, 90, .35);
    transition: background .25s;
  }
  .switch .knob {
    position: absolute; top: 4px; left: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #ffe6b0; box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    transition: transform .25s cubic-bezier(.4, 1.4, .5, 1);
  }
  .switch input:checked ~ .track { background: linear-gradient(120deg, #ffb03a, #ff7a1f); }
  .switch input:checked ~ .knob { transform: translateX(22px); background: #fff; }

  /* ===================== 历史 ===================== */
  .history { display: flex; flex-direction: column; gap: 7px; }
  .hist-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 168, 60, .12);
    border: 1px solid rgba(240, 150, 60, .28);
    border-radius: 11px; padding: 9px 12px; font-size: 13.5px;
    animation: popIn .25s ease;
  }
  .hist-item .idx {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #fff;
    background: linear-gradient(150deg, #ffa62b, #e8461f);
  }
  .hist-item .name { flex: 1; font-weight: 600; color: #8a3208; }
  .hist-item .who { font-size: 11.5px; color: rgba(120, 40, 10, .55); }
  .hist-item .time { font-size: 11px; color: rgba(120, 40, 10, .45); }
  .hist-empty { font-size: 13px; color: rgba(120, 40, 10, .42); text-align: center; padding: 8px; }

  .btn-mini {
    font-size: 11.5px; color: rgba(120, 40, 10, .55);
    background: transparent; border: 1px dashed rgba(200, 120, 40, .4);
    border-radius: 999px; padding: 3px 11px; cursor: pointer; font-family: inherit;
  }

  /* ===================== 结果弹层 ===================== */
  .verdict {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: 22px;
    background: radial-gradient(ellipse at center, rgba(60, 12, 0, .78) 0%, rgba(30, 5, 0, .88) 100%);
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }
  .verdict.show { opacity: 1; visibility: visible; }
  .verdict-box {
    width: 100%; max-width: 380px; text-align: center;
    padding: clamp(24px, 7vw, 34px) clamp(18px, 5vw, 28px) clamp(20px, 5.5vw, 26px);
    border-radius: 26px;
    background: linear-gradient(168deg, #fffaf0 0%, #ffeccd 60%, #ffdca8 100%);
    box-shadow: 0 26px 60px rgba(60, 10, 0, .55), inset 0 2px 0 #fff;
    transform: scale(.86) translateY(14px);
    transition: transform .42s cubic-bezier(.2, 1.5, .4, 1);
  }
  .verdict.show .verdict-box { transform: scale(1) translateY(0); }
  .verdict-emoji { font-size: 40px; line-height: 1; }
  .verdict-kicker {
    margin-top: 12px; font-size: 14px; letter-spacing: 5px; text-indent: 5px;
    color: rgba(160, 60, 10, .7);
  }
  .verdict-name {
    margin-top: 8px;
    font-size: clamp(32px, 11vw, 52px); font-weight: 800;
    font-family: var(--serif); letter-spacing: 2px; color: #c2290a;
    text-shadow: 0 2px 0 rgba(255, 255, 255, .8), 0 8px 22px rgba(200, 60, 0, .3);
    line-height: 1.25; word-break: break-word;
  }
  .verdict-sub { margin-top: 14px; font-size: 13px; letter-spacing: 1px; color: rgba(150, 70, 20, .65); }
  .verdict-actions { display: flex; gap: 10px; margin-top: 20px; }
  .verdict-actions .btn { flex: 1; font-size: 15px; letter-spacing: 2px; padding: 13px 12px; border-radius: 999px; }
  .btn-ok {
    color: #fff; background: linear-gradient(160deg, #ff9a1f, #e8461f);
    box-shadow: 0 8px 20px rgba(200, 60, 10, .4);
  }
  .btn-retry {
    color: #8a3208; background: rgba(255, 168, 60, .22);
    border: 1.5px solid rgba(240, 150, 60, .55);
  }
  .verdict-cloud {
    margin-top: 12px; font-size: 11.5px; letter-spacing: 1px;
    color: rgba(150, 90, 30, .6); min-height: 1.3em;
  }

  .confetti {
    position: fixed; top: -10vh; z-index: 21; font-size: 20px;
    pointer-events: none; animation: confFall linear forwards;
  }
  @keyframes confFall { to { transform: translateY(118vh) rotate(520deg); opacity: 0; } }

  .foot {
    text-align: center; font-size: 11.5px; letter-spacing: 2px;
    color: rgba(255, 248, 236, .55);
    text-shadow: 0 1px 4px rgba(120, 30, 0, .4);
  }

  @media (prefers-reduced-motion: reduce) {
    .floaty, .btn-spin, .confetti, .sk, #slotName.win { animation: none !important; }
  }
</style>
</head>
<body>

  <div id="floaties" aria-hidden="true"></div>

  <div class="wrap">

    <header class="hero">
      <h1>今天吃什么？<span class="qw">交给命运吧</span></h1>
      <p>宿舍共享版 · 你和室友同一份菜单</p>
      <div class="syncbar" id="syncBar">
        <span class="dot"></span>
        <span id="syncText">正在连接云端…</span>
        <button id="refreshBtn" type="button">刷新</button>
      </div>
    </header>

    <!-- ===== 抽奖区 ===== -->
    <section class="card slot-card">
      <div class="display">
        <div class="display-label">今 日 之 选</div>
        <strong id="slotName">— — —</strong>
        <div class="display-hint" id="slotHint">点下面的按钮，让命运决定</div>
      </div>

      <button class="btn btn-spin" id="spinBtn">抽 奖</button>
      <button class="btn btn-again" id="againBtn">换 一 个</button>

      <div class="switch-row">
        <div class="switch-label">
          <strong>排除刚吃过的</strong>
          <span id="excludeInfo">开启后会避开上次的结果</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="excludeToggle">
          <span class="track"></span>
          <span class="knob"></span>
        </label>
      </div>
    </section>

    <!-- ===== 菜单（云端） ===== -->
    <section class="card">
      <div class="card-title">
        <span>🍜 宿舍菜单</span>
        <span class="badge" id="foodCount">—</span>
        <span class="spacer"></span>
        <span class="badge">云端同步</span>
      </div>

      <div class="nick-row">
        <span>我的昵称</span>
        <input id="nickInput" type="text" maxlength="12" autocomplete="off" placeholder="比如：3号床">
      </div>

      <div class="add-row">
        <input id="foodInput" type="text" maxlength="12" autocomplete="off"
               placeholder="输入食物名，比如：酸菜鱼" aria-label="输入食物名">
        <button class="btn btn-add" id="addBtn">添加</button>
      </div>

      <div class="chips" id="chips"></div>
      <div id="listBox">
        <div class="skeleton-row">
          <div class="sk" style="width:90px"></div><div class="sk" style="width:76px"></div>
          <div class="sk" style="width:104px"></div><div class="sk" style="width:68px"></div>
        </div>
      </div>
    </section>

    <!-- ===== 历史（云端） ===== -->
    <section class="card">
      <div class="card-title">
        <span>🕒 大家都吃了啥</span>
        <span class="badge">最近 8 次</span>
        <span class="spacer"></span>
        <button class="btn-mini" id="refreshHistBtn">刷新</button>
      </div>
      <div class="history" id="historyBox"></div>
    </section>

    <p class="foot">数据存在云端 · 你和室友实时共享</p>
  </div>

  <!-- ===== 结果弹层 ===== -->
  <div class="verdict" id="verdict" role="dialog" aria-modal="true" aria-label="抽奖结果">
    <div class="verdict-box">
      <div class="verdict-emoji" id="verdictEmoji">🍽️</div>
      <div class="verdict-kicker">今 天 就 吃</div>
      <div class="verdict-name" id="verdictName"></div>
      <div class="verdict-sub" id="verdictSub"></div>
      <div class="verdict-cloud" id="verdictCloud"></div>
      <div class="verdict-actions">
        <button class="btn btn-retry" id="retryBtn">换一个</button>
        <button class="btn btn-ok" id="okBtn">就它了！</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     1. Supabase 配置
     publishable / anon key 是公开密钥，写在前端是安全的；
     真正的门禁是数据库 RLS。切勿把 service_role(secret) key 放前端。
     ============================================================ */
  var SUPABASE_URL = 'https://fedfguteqkstyamjlubt.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_eehHVSB6_7HSWyGrgOnziA_WN0h3cl3';
  var T_FOODS = 'foods';
  var T_HIST = 'eat_history';

  var HIST_SHOW = 8;         // 历史展示条数
  var POLL_MS = 10000;       // 轮询间隔（室友加了菜，最多 10 秒后你这边出现）

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(id) { return document.getElementById(id); }
  function rnd(a, b) { return Math.random() * (b - a) + a; }

  /* ============================================================
     2. 本地只做"轻缓存"和偏好设置，不再是主数据源
     ============================================================ */
  function lsGet(k, d) {
    try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }

  var KEY_NICK = 'eatwhat.nick';
  var KEY_EXCLUDE = 'eatwhat.exclude.v2';
  var KEY_LAST = 'eatwhat.last.v2';
  var KEY_CACHE_F = 'eatwhat.cache.foods';
  var KEY_CACHE_H = 'eatwhat.cache.hist';

  var nick = lsGet(KEY_NICK, '') || '';
  var excludeOn = lsGet(KEY_EXCLUDE, false) === true;
  var lastPick = lsGet(KEY_LAST, null);
  if (typeof lastPick === 'string') {
    try { var once = JSON.parse(lastPick); if (typeof once === 'string') lastPick = once; } catch (e) {}
  }

  /* ============================================================
     3. Supabase 请求封装
     ============================================================ */
  function apiHeaders(extra) {
    var h = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    };
    for (var k in (extra || {})) h[k] = extra[k];
    return h;
  }

  function api(path, options) {
    options = options || {};
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 15000);

    return fetch(SUPABASE_URL + '/rest/v1/' + path, {
      method: options.method || 'GET',
      headers: apiHeaders(options.headers),
      body: options.body,
      signal: ctrl.signal
    }).then(function (res) {
      clearTimeout(timer);
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
        if (!res.ok) {
          var msg = (data && (data.message || data.hint || data.error)) || ('HTTP ' + res.status);
          var err = new Error(msg);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    }).catch(function (err) {
      clearTimeout(timer);
      if (err.name === 'AbortError') { var e2 = new Error('请求超时'); e2.kind = 'timeout'; throw e2; }
      if (!err.status) {
        var e3 = new Error('连不上云端：如果你是用 file:// 双击打开的，请改用网址访问');
        e3.kind = 'network';
        throw e3;
      }
      throw err;
    });
  }

  function friendly(err) {
    if (err.kind === 'network') return err.message;
    if (err.kind === 'timeout') return '网络有点慢，稍后再试';
    if (err.status === 401 || err.status === 403) return '没有权限，请检查数据库 RLS 策略';
    if (err.status === 404) return '找不到数据表，请确认表名是 foods / eat_history';
    if (err.status === 409) return '这道菜已经在菜单里了';
    return err.message;
  }

  // 读菜单
  function fetchFoods() {
    return api(T_FOODS + '?select=id,name,added_by,created_at&order=created_at.asc');
  }
  // 加菜
  function insertFood(name, by) {
    return api(T_FOODS, {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ name: name, added_by: by || null })
    });
  }
  // 删菜
  function deleteFood(id) {
    return api(T_FOODS + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE' });
  }
  // 读历史
  function fetchHistory() {
    return api(T_HIST + '?select=id,name,drawn_by,created_at&order=created_at.desc&limit=' + HIST_SHOW);
  }
  // 写历史
  function insertHistory(name, by) {
    return api(T_HIST, {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ name: name, drawn_by: by || null })
    });
  }

  /* ============================================================
     4. 状态与同步指示
     ============================================================ */
  var foods = [];          // 云端菜单（主数据源）
  var history = [];        // 云端历史
  var cloudOK = false;     // 是否连上云端
  var busy = false;

  var syncBar = $('syncBar');
  var syncText = $('syncText');

  function setSync(state, text) {
    syncBar.className = 'syncbar' + (state === 'ok' ? '' : ' ' + state);
    syncText.textContent = text;
  }

  // 菜单数量变了就刷新状态条。增删之后必须调用，
  // 否则会出现"列表已变、状态条还写着旧数量"的不一致。
  function syncCountText() {
    if (!cloudOK) return;
    setSync('ok', '已连接云端 · ' + foods.length + ' 道菜');
  }

  /* ============================================================
     5. 渲染
     ============================================================ */
  var listBox = $('listBox');
  var foodCount = $('foodCount');

  function renderFoods() {
    foodCount.textContent = foods.length ? foods.length + ' 项' : '空';
    listBox.textContent = '';

    if (!foods.length) {
      var tip = document.createElement('div');
      tip.className = 'empty-tip';
      tip.textContent = cloudOK ? '菜单还是空的，加几个菜吧 ✍️' : '暂时拿不到菜单，点上面的「刷新」试试';
      listBox.appendChild(tip);
      return;
    }

    var wrap = document.createElement('div');
    wrap.className = 'food-list';

    foods.forEach(function (f) {
      var item = document.createElement('span');
      item.className = 'food-item';

      var label = document.createElement('span');
      label.textContent = f.name;                 // textContent：天然防 XSS

      if (f.added_by) {
        var who = document.createElement('span');
        who.className = 'who';
        who.textContent = f.added_by;
        item.appendChild(label);
        item.appendChild(who);
      } else {
        item.appendChild(label);
      }

      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '✕';
      del.setAttribute('aria-label', '删除 ' + f.name);
      del.addEventListener('click', function () { removeFood(f, item); });

      item.appendChild(del);
      wrap.appendChild(item);
    });
    listBox.appendChild(wrap);
  }

  function renderHistory() {
    var box = $('historyBox');
    box.textContent = '';
    if (!history.length) {
      var e = document.createElement('div');
      e.className = 'hist-empty';
      e.textContent = cloudOK ? '还没人抽过，快去试试手气 🎲' : '暂时拿不到记录';
      box.appendChild(e);
      return;
    }
    history.forEach(function (h, i) {
      var row = document.createElement('div');
      row.className = 'hist-item';

      var idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = String(i + 1);

      var nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = h.name;

      row.appendChild(idx);
      row.appendChild(nm);

      if (h.drawn_by) {
        var w = document.createElement('span');
        w.className = 'who';
        w.textContent = h.drawn_by;
        row.appendChild(w);
      }

      var tm = document.createElement('span');
      tm.className = 'time';
      tm.textContent = shortTime(h.created_at);
      row.appendChild(tm);

      box.appendChild(row);
    });
  }

  function shortTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function renderAll() {
    renderFoods();
    renderHistory();
    updateExcludeInfo();
  }

  var slotHint = $('slotHint');
  function flashHint(text) {
    slotHint.textContent = text;
    clearTimeout(flashHint._t);
    flashHint._t = setTimeout(function () {
      slotHint.textContent = '点下面的按钮，让命运决定';
    }, 3000);
  }

  function updateExcludeInfo() {
    var info = $('excludeInfo');
    if (!excludeOn) { info.textContent = '开启后会避开上次的结果'; return; }
    if (foods.length <= 1) { info.textContent = '菜单只有一个，无法避开'; return; }
    info.textContent = lastPick ? '已避开：' + lastPick : '已开启，下次抽奖生效';
  }

  /* ============================================================
     6. 云端读写
     ============================================================ */
  function refreshFoods(silent) {
    return fetchFoods().then(function (list) {
      foods = list || [];
      cloudOK = true;
      lsSet(KEY_CACHE_F, foods);
      renderFoods();
      updateExcludeInfo();
      if (!silent) setSync('ok', '已连接云端 · ' + foods.length + ' 道菜');
      return foods;
    }).catch(function (err) {
      cloudOK = false;
      var cached = lsGet(KEY_CACHE_F, null);
      if (Array.isArray(cached) && cached.length && !foods.length) {
        foods = cached;
        renderFoods();
      }
      setSync('err', '云端读取失败');
      if (!silent) flashHint('读取失败：' + friendly(err));
      throw err;
    });
  }

  function refreshHistory(silent) {
    return fetchHistory().then(function (list) {
      history = list || [];
      lsSet(KEY_CACHE_H, history);
      renderHistory();
      return history;
    }).catch(function (err) {
      var cached = lsGet(KEY_CACHE_H, null);
      if (Array.isArray(cached) && cached.length && !history.length) {
        history = cached;
        renderHistory();
      }
      if (!silent) flashHint('历史读取失败：' + friendly(err));
      throw err;
    });
  }

  function addFood(name) {
    name = (name || '').trim().replace(/\s+/g, ' ').slice(0, 12);
    if (!name) { $('foodInput').focus(); return; }
    if (foods.some(function (f) { return f.name.toLowerCase() === name.toLowerCase(); })) {
      flashHint('「' + name + '」已经在菜单里了');
      return;
    }

    var btn = $('addBtn');
    btn.disabled = true;
    btn.textContent = '添加中';

    insertFood(name, nick).then(function (rows) {
      var created = (rows && rows[0]) || null;
      if (created) {
        foods.push(created);
        renderFoods();
        updateExcludeInfo();
        syncCountText();
      }
      $('foodInput').value = '';
      flashHint('已加进宿舍菜单：「' + name + '」');
      // 拉一次确保和云端一致
      return refreshFoods(true);
    }).catch(function (err) {
      if (err.status === 409) {
        // 名字冲突（唯一索引），把最新列表拉下来
        flashHint('「' + name + '」已经被室友加过了');
        refreshFoods(true).catch(function () {});
      } else {
        flashHint('添加失败：' + friendly(err));
      }
    }).then(function () {
      btn.disabled = false;
      btn.textContent = '添加';
      $('foodInput').focus();
    });
  }

  function removeFood(f, itemEl) {
    if (!confirm('把「' + f.name + '」从宿舍菜单里删掉？\n（所有人都看不到了）')) return;

    itemEl.classList.add('pending');
    deleteFood(f.id).then(function () {
      foods = foods.filter(function (x) { return x.id !== f.id; });
      renderFoods();
      updateExcludeInfo();
      syncCountText();
      flashHint('已删除「' + f.name + '」');
    }).catch(function (err) {
      itemEl.classList.remove('pending');
      flashHint('删除失败：' + friendly(err));
    });
  }

  /* ============================================================
     7. 抽奖
     ============================================================ */
  var slotName = $('slotName');
  var spinBtn = $('spinBtn');
  var againBtn = $('againBtn');
  var verdict = $('verdict');
  var spinning = false;
  var lastPickBefore = null;

  function candidates() {
    if (!excludeOn || !lastPick || foods.length <= 1) return foods.slice();
    var pool = foods.filter(function (f) { return f.name !== lastPick; });
    return pool.length ? pool : foods.slice();
  }

  function spin() {
    if (spinning) return;

    if (!foods.length) {
      flashHint('菜单是空的，先加几个菜吧');
      return;
    }

    lastPickBefore = (excludeOn && lastPick) ? lastPick : null;
    spinning = true;
    spinBtn.disabled = true;
    againBtn.classList.remove('show');
    slotName.classList.remove('win');
    slotName.classList.add('rolling');

    var pool = candidates();
    var finalFood = pool[Math.floor(Math.random() * pool.length)];

    var seq = [];
    var steps = 14;
    for (var i = 0; i < steps; i++) seq.push(pool[Math.floor(Math.random() * pool.length)].name);
    seq.push(finalFood.name);

    var totalMs = 1000;
    var weights = [], sumW = 0;
    for (var j = 0; j < seq.length; j++) { var w = 0.5 + j * 0.16; weights.push(w); sumW += w; }

    var idx = 0;
    (function next() {
      if (idx >= seq.length) return finish(finalFood);
      slotName.textContent = seq[idx];
      var delay = (weights[idx] / sumW) * totalMs;
      idx++;
      setTimeout(next, delay);
    })();
  }

  function finish(food) {
    var name = food.name;
    slotName.textContent = name;
    slotName.classList.remove('rolling');
    slotName.classList.add('win');

    lastPick = name;
    lsSet(KEY_LAST, lastPick);
    updateExcludeInfo();

    spinning = false;
    spinBtn.disabled = false;
    againBtn.classList.add('show');

    // 先把结果展示出来，再去写云端历史（不让网络拖慢手感）
    showVerdict(name);

    insertHistory(name, nick).then(function () {
      $('verdictCloud').textContent = '✓ 已记入宿舍历史';
      return refreshHistory(true);
    }).catch(function (err) {
      $('verdictCloud').textContent = '⚠ 历史未写入：' + friendly(err);
    });
  }

  function showVerdict(name) {
    $('verdictName').textContent = name;
    $('verdictEmoji').textContent = EMOJI_FOR[name] || '🍽️';
    $('verdictCloud').textContent = '正在记录…';

    var subs = [
      '别犹豫了，就它吧！',
      '命运的旨意，无法违抗 ✨',
      '这顿饭，交给月亮决定 🌙',
      '吃完再想下一顿也不迟 😋',
      '相信直觉，就是它了'
    ];
    var extra = '';
    if (excludeOn && lastPickBefore) extra = '（已避开「' + lastPickBefore + '」）';
    $('verdictSub').textContent = subs[Math.floor(Math.random() * subs.length)] + extra;

    verdict.classList.add('show');
    burstConfetti();
  }

  var EMOJI_FOR = {
    '酸菜鱼': '🐟', '麻辣烫': '🍲', '牛肉面': '🍜', '黄焖鸡': '🍗',
    '寿司': '🍣', '烤肉': '🍖', '汉堡': '🍔', '饺子': '🥟',
    '火锅': '🍲', '烧烤': '🍢', '螺蛳粉': '🍜', '盖浇饭': '🍚',
    '沙拉': '🥗', '小笼包': '🥟', '炸鸡': '🍗', '咖喱饭': '🍛'
  };

  function burstConfetti() {
    if (reduceMotion) return;
    var EMOJI = ['🎉', '✨', '🍜', '🍕', '🍣', '🥳', '⭐', '🍰'];
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = EMOJI[Math.floor(Math.random() * EMOJI.length)];
      s.style.left = (Math.random() * 96) + '%';
      s.style.fontSize = (16 + Math.random() * 16).toFixed(0) + 'px';
      s.style.animationDuration = (1.6 + Math.random() * 1.4).toFixed(2) + 's';
      document.body.appendChild(s);
      (function (node) { setTimeout(function () { node.remove(); }, 3200); })(s);
    }
  }

  function closeVerdict() { verdict.classList.remove('show'); }

  spinBtn.addEventListener('click', function () { spin(); });
  againBtn.addEventListener('click', function () { closeVerdict(); spin(); });
  $('okBtn').addEventListener('click', closeVerdict);
  $('retryBtn').addEventListener('click', function () { closeVerdict(); spin(); });
  verdict.addEventListener('click', function (e) { if (e.target === verdict) closeVerdict(); });

  $('addBtn').addEventListener('click', function () { addFood($('foodInput').value); });
  $('foodInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addFood($('foodInput').value); }
  });

  var nickInput = $('nickInput');
  nickInput.value = nick;
  nickInput.addEventListener('change', function () {
    nick = nickInput.value.trim().slice(0, 12);
    lsSet(KEY_NICK, nick);
    flashHint(nick ? '好，以后署名：' + nick : '已清空昵称');
  });

  var excludeToggle = $('excludeToggle');
  excludeToggle.checked = excludeOn;
  excludeToggle.addEventListener('change', function () {
    excludeOn = excludeToggle.checked;
    lsSet(KEY_EXCLUDE, excludeOn);
    updateExcludeInfo();
    flashHint(excludeOn ? '已开启：会避开上次吃过的' : '已关闭：完全随机');
  });

  $('refreshBtn').addEventListener('click', function () {
    setSync('local', '正在刷新…');
    refreshFoods(true).then(function () { refreshHistory(true); setSync('ok', '已连接云端 · ' + foods.length + ' 道菜'); })
      .catch(function () { setSync('err', '刷新失败'); });
  });
  $('refreshHistBtn').addEventListener('click', function () {
    refreshHistory(false).catch(function () {});
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeVerdict();
    if (e.code === 'Space' && document.activeElement !== $('foodInput') &&
        document.activeElement !== nickInput) {
      e.preventDefault();
      spin();
    }
  });

  /* 快捷标签 */
  (function buildChips() {
    var box = $('chips');
    ['火锅', '烧烤', '螺蛳粉', '盖浇饭', '沙拉', '小笼包', '炸鸡', '咖喱饭'].forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = '+ ' + s;
      b.addEventListener('click', function () { addFood(s); });
      box.appendChild(b);
    });
  })();

  /* 漂浮食物 */
  (function buildFloaties() {
    var layer = $('floaties');
    var EMOJI = ['🍜', '🍕', '🍣', '🍔', '🥟', '🍢', '🍚', '🌮', '🍤', '🥘', '🍰', '🍩'];
    var n = window.innerWidth < 480 ? 12 : 18;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'floaty';
      s.textContent = EMOJI[i % EMOJI.length];
      s.style.left = (Math.random() * 96) + '%';
      s.style.fontSize = (16 + Math.random() * 26).toFixed(0) + 'px';
      s.style.animationDuration = (16 + Math.random() * 18).toFixed(1) + 's';
      s.style.animationDelay = (-Math.random() * 30).toFixed(1) + 's';
      frag.appendChild(s);
    }
    layer.appendChild(frag);
  })();

  /* ============================================================
     8. 启动：加载云端数据 + 轮询同步
     ============================================================ */
  setSync('local', '正在连接云端…');

  // 先用缓存立刻渲染，避免白屏
  var cachedF = lsGet(KEY_CACHE_F, null);
  if (Array.isArray(cachedF) && cachedF.length) { foods = cachedF; renderFoods(); }
  var cachedH = lsGet(KEY_CACHE_H, null);
  if (Array.isArray(cachedH) && cachedH.length) { history = cachedH; renderHistory(); }

  refreshFoods(false).catch(function () {});
  refreshHistory(true).catch(function () {});

  // 轮询：室友加了菜，最多 10 秒后自动出现
  // 页面切到后台时暂停，省流量；切回来立刻同步一次
  var lastFoodCount = -1;

  function poll() {
    if (document.hidden) return;
    fetchFoods().then(function (list) {
      var n = (list || []).length;
      if (n !== lastFoodCount || lastFoodCount === -1) {
        lastFoodCount = n;
        foods = list || [];
        cloudOK = true;
        lsSet(KEY_CACHE_F, foods);
        renderFoods();
        updateExcludeInfo();
        syncCountText();
      }
    }).catch(function () {
      cloudOK = false;
      setSync('err', '云端已断开');
    });
    fetchHistory().then(function (list) {
      history = list || [];
      lsSet(KEY_CACHE_H, history);
      renderHistory();
    }).catch(function () {});
  }

  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) poll();      // 切回来立刻同步一次
  });
})();
</script>
</body>
</html>
